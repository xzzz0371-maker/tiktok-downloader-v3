<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok下载器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
        <span>下载器</span>
      </div>
      <div class="header-right">
        <span id="statusBadge" class="badge">🎉 免费版</span>
        <button id="bringToFrontBtn" class="icon-btn" title="拉到最前面" style="display:none;">🔝</button>
        <button id="sidePanelBtn" class="icon-btn" title="侧边栏模式（浏览器右侧，不消失）">📋</button>
        <button id="openWindowBtn" class="icon-btn" title="独立窗口（点击别处不消失）">📌</button>
        <button id="themeToggle" class="icon-btn">🌓</button>
      </div>
    </header>

    <div class="status-row">
      <span id="statusText">🎉 免费 · 无限下载</span>
    </div>

    <!-- 推荐页自动解析开关 -->
    <div class="settings-row">
      <label class="setting-toggle">
        <input type="checkbox" id="recommendAutoParse" checked>
        <span class="toggle-slider"></span>
        <span class="setting-label">推荐页滑动自动解析</span>
      </label>
    </div>

    <div class="input-section">
      <textarea id="urlInput" rows="1" placeholder="粘贴链接，每行一个"></textarea>
      <div class="input-actions">
        <button id="parseBtn" class="btn btn-primary">解析</button>
        <button id="stopParseBtn" class="btn btn-danger" style="display:none;">停止</button>
        <button id="grabBtn" class="btn btn-ghost">当前页</button>
        <button id="clearBtn" class="btn btn-ghost">清空</button>
        <div id="statusIndicator" class="status-indicator" style="display:none;">
          <span class="spinner"></span>
          <span id="statusMessage">解析中...</span>
        </div>
      </div>
    </div>

    <div id="resultToolbar" class="result-toolbar" style="display:none;">
      <span id="videoCount">已解析 0 个视频</span>
      <label class="skip-downloaded-label">
        <input type="checkbox" id="skipDownloaded" checked>
        <span>跳过已下载</span>
      </label>
      <button id="downloadAllBtn" class="btn btn-primary btn-sm">⬇ 下载全部</button>
    </div>
    <div id="historyToolbar" class="history-toolbar" style="display:none;">
      <span id="downloadedCount">已下载 0 个视频</span>
      <div class="history-actions">
        <button id="exportHistoryBtn" class="btn btn-ghost btn-xs">导出</button>
        <button id="clearHistoryBtn" class="btn btn-ghost btn-xs">清空</button>
      </div>
    </div>

    <div id="videoList" class="video-list">
      <div class="empty-state">
        <div class="empty-icon">🎬</div>
        <p>粘贴链接开始解析</p>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="previewModal" class="preview-modal" style="display:none;">
      <div class="preview-overlay" id="previewOverlay"></div>
      <div class="preview-content">
        <button id="previewClose" class="preview-close">✕</button>
        <video id="previewVideo" controls autoplay playsinline></video>
        <div class="preview-info">
          <div class="preview-title" id="previewTitle"></div>
          <div class="preview-author" id="previewAuthor"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
